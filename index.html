<div class="wrap wrap--home">

        <a class="pill-link" href="subrayados.html" data-i18n="nav_highlights">✎ subrayados</a>

        <div id="lang-switch" class="lang-switch" role="group" aria-label="Idioma" data-i18n-attr="aria-label:lang_label"></div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">
          <span class="to-contrast" data-i18n="theme_to_contrast">◑ alto contraste</span>
          <span class="to-pastel" data-i18n="theme_to_pastel">◐ modo pastel</span>

      <a class="avatar" href="post.html?p=sobre-mi" aria-label="sobre mí" data-i18n-attr="aria-label:sec_about">

        <span id="avatar-live" class="avatar__live" hidden>● live</span>
      </a>
      <div>
        <h1><span data-i18n="hero_before">Aprende con el</span> <span class="accent" data-i18n="hero_accent">método Feynman</span></h1>

  <div class="home-layout">

       on wide screens CSS moves it to a sticky column on the right. Filled by home.js -->

    <h2 class="panel__title" id="panel-title" data-i18n="panel_title">Tu progreso</h2>
    <div class="panel__grid" id="panel-body"></div>
  </aside>

  <div class="home-main">
  <!-- Filters and cards are generated from content/index.json -->
  <div class="search">
    <label class="visually-hidden" for="search" data-i18n="search_label">Buscar entradas</label>
    <input id="search" class="search__input" type="search" placeholder="🔍 busca por título, tema o palabra…" data-i18n-attr="placeholder:search_placeholder" autocomplete="off" spellcheck="false">
  </div>
  <nav class="filters" id="filters" aria-label="Filtrar por sección" data-i18n-attr="aria-label:filters_label"></nav>
  <p class="empty" id="no-results" hidden data-i18n="no_results">Ninguna entrada coincide con tu búsqueda.</p>
  <!-- Sections (start here, tools, explanations, diary) or, while searching/filtering, one list of results -->
  <main id="content" aria-live="polite">
    <p class="empty" data-i18n="loading">Cargando…</p>

  </div>
  </div>

<footer class="site-footer">
